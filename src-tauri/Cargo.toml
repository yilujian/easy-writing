[package]
name = "ew-client-desktop"
version = "2.1.1"
description = "易创桌面客户端"
authors = ["yilujian"]
license = "AGPL-3.0-only"
repository = "https://github.com/yilujian/easy-writing"
homepage = "https://github.com/yilujian/easy-writing"
keywords = ["writing", "novel", "ai", "local-first", "tauri"]
edition = "2021"

[lib]
name = "ew_client_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 本地完整验收文件按仓库约定不上传；普通构建不依赖它们。
local-tests = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# unsafe-headers：允许前端把 Origin 传成空串，让插件摘掉自动补的 Origin 头。
# 本地模型服务（Ollama 等）会按来源拒绝桌面端请求，见 utils/local-ai-client.ts 的 resolveAiFetch。
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 单实例锁：两个进程打开同一个 ew-writing.db 会在 Windows 上抢文件锁，
# 表现为本地库时开时不开。第二个实例直接把已有窗口拉到前台。
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Node 的 Windows 文件入口需要标准路径；复用 Tauri 已有的路径转换库。
dunce = "1.0.5"
jsonschema = { version = "0.33", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
sha2 = "0.10"
hmac = "0.12"
# 复用锁文件已有版本，章节字数与前端 Unicode Letter/Number 口径保持一致。
regex = "1"
similar = "3.2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# configure_client 使用更新器公开的 HTTP 配置接口，固定 minor 版本避免类型漂移。
tauri-plugin-updater = "~2.10"
# 关窗兜底超时用（tauri 自带 async_runtime 即 tokio，这里显式声明以使用 tokio::time）
tokio = { version = "1", features = ["time", "net", "sync", "rt", "rt-multi-thread"] }
# 模型网关：本机 HTTP 服务端与到供应商的客户端；与 tauri-plugin-http 共用同一版本的 reqwest/hyper
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
futures-util = "0.3"
# 一键备份/恢复的单文件压缩包（updater 已间接依赖同一版本）
zip = { version = "4", default-features = false, features = ["deflate"] }
# 微信 ClawBot 通道的 X-WECHAT-UIN 请求头要 base64；reqwest 已带同版本，不增加体积
base64 = "0.22"
# 微信通道发图片/文件：iLink 协议要求媒体按 AES-128-ECB 加密上传 CDN，并附明文 MD5；
# 密钥与文件键用随机字节（rand / hex 依赖树里已有同版本）
aes = "0.8"
md-5 = "0.10"
hex = "0.4"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# 与 Tauri 的原生窗口调整使用同一主队列，确保几何变更完成后再显示。
dispatch2 = "0.3.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
